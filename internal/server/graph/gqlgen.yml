# gqlgen config for the promptbook GraphQL endpoint.
#
# `ent.graphql` is regenerated by entgql every time `go generate
# ./internal/ent` runs; do not edit it by hand. `schema.graphql` is the
# place to add hand-written root-level extensions (currently empty —
# every read query lives in the entgql-generated file).
schema:
  - schema.graphql
  - ent.graphql

exec:
  filename: generated.go
  package: graph

model:
  filename: models_gen.go
  package: graph

resolver:
  layout: follow-schema
  dir: .
  package: graph
  filename_template: "{name}.resolvers.go"

# Bind the generated GraphQL ID scalar to int64 — every node in our
# schema uses an int64 PK and entgql refuses to generate a relay schema
# with mixed Go ID types, so we forced everything to int64 in the ent
# layer. graphql.IntID isn't right because that's int; we map ID to
# int64 explicitly here.
struct_tag: json

# Auto-bind ent-generated types so gqlgen reuses them as the underlying
# Go models. Without this the resolver would have to hand-roll an
# adapter for every entity. Introspection is bound first so gqlgen does
# not regenerate __Field/__Type stubs (which collide with the package
# already declaring them).
autobind:
  - github.com/99designs/gqlgen/graphql/introspection
  - github.com/nicolerenee/promptbook/internal/ent

# Disable the generated getters — every entity already exposes its
# fields publicly through the ent struct, and the extra accessor methods
# just bloat the binary.
omit_getters: true
# Tell gqlgen the Node interface is implemented by ent.Noder, the
# generated marker type entgql produces. Without this gqlgen emits its
# own interface that ent's types don't satisfy.
models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.Int64
  Node:
    model:
      - github.com/nicolerenee/promptbook/internal/ent.Noder
