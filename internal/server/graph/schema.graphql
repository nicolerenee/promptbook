# Root-level GraphQL schema additions for promptbook.
#
# The bulk of the schema (every node type, connection, where-input,
# order-input) is generated by entgql into ent.graphql. This file owns
# the cross-cutting bits entgql either does not emit on its own or that
# need to live somewhere stable across regeneration cycles.
#
# - The Time scalar is declared here so entgql's regenerator does not
#   thrash on it (entgql skips adding the scalar when it sees it
#   declared in another schema file, which means a second `go generate`
#   pass would otherwise drop it from ent.graphql).
# - The per-type fetch-by-id query shortcuts work around the fact that
#   promptbook does not maintain ent's `ent_types` meta table; without
#   that table the Relay node(id:) lookup cannot map a global id back
#   to a row's table. The server resolver returns a documented error
#   from Node/Nodes and routes single-row reads through these typed
#   queries instead.
scalar Time

extend type Query {
  recording(id: ID!): Recording
  show(id: ID!): Show
  performer(id: ID!): Performer
  collectionEntry(id: ID!): CollectionEntry
  wantsEntry(id: ID!): WantsEntry
}
