# enrichment.graphql — server-side derived fields layered on top of
# the entgql-generated schema.
#
# entgql owns ent.graphql; that file is regenerated every codegen run
# and any hand-edits get blown away. The fields below either need
# logic that doesn't live on the ent graph (file-system mtime,
# reconciler-derived status, image-cache URLs) or shape that doesn't
# round-trip cleanly through ent's "field on a column" model
# (BannerLayout's parsed-from-JSON struct, the per-status histogram
# on Show).
#
# All resolvers live in enrichment.resolvers.go. The fields are added
# to the existing ent types via `extend type` so the connection +
# where-input plumbing entgql produced for those types still works.

# BannerLayout is the parsed-from-OverlayStyleJSON shape the recording
# detail page consumes. Mirrors bannerLayoutResponse from the legacy
# REST endpoint. Both fields default to empty string when nothing is
# persisted; the SPA falls back to "bottom" / "middle" defaults.
type BannerLayout {
  position: String!
  imageRegion: String!
}

# ShowStateCounts is the per-status histogram a Show carries. The five
# Status tokens (synced / format_mismatch / missing / wanted / orphan)
# get one Int! field each so the SPA can render the badge cluster
# without parsing a map shape.
type ShowStateCounts {
  synced: Int!
  formatMismatch: Int!
  missing: Int!
  wanted: Int!
  orphan: Int!
}

# ResolvedCastEntry is the cast-row shape the Recording detail page
# needs. Mirrors storage.ResolvedCastEntry but adds the local
# headshot URL the picker resolves through the image cache. Both id
# fields are PrefixedID — castEntryID points at the join row,
# performerID at the canonical performer.
type ResolvedCastEntry {
  castEntryID: ID!
  performerID: ID!
  performerName: String!
  performerSlug: String!
  characterID: ID
  characterName: String
  statusLabel: String
  statusAbbrev: String
  characterOrder: Int!
  localHeadshotURL: String!
}

# Recording field extensions. status comes from the storage.LoadState
# reconciler; the URL fields and nfo* fields read from disk through
# the image cache + filesystem helpers. bannerLayout +
# overlayTextOverride + overlayDisabled surface the recording's
# persisted image-choice fields the SPA already keys off of.
extend type Recording {
  status: String!
  localPosterURL: String!
  localFanartURL: String!
  nfoContent: String!
  nfoModifiedAt: Time
  bannerLayout: BannerLayout!
  overlayTextOverride: String
  overlayDisabled: Boolean!
  resolvedCast: [ResolvedCastEntry!]!
  # Reconciler-derived booleans + format strings the SPA detail page
  # uses to drive its danger-zone + format-mismatch surfaces. Sourced
  # from the same storage.LoadState reconciler that powers `status`
  # so the values agree across fields.
  inCollection: Boolean!
  inWants: Boolean!
  encoraFormat: String!
  localFormatString: String!
  collectedAt: String
}

# Show field extensions. localBannerURL + recordingCount + stateCounts
# match the legacy ShowDetailResponse fields; firstYear / lastYear
# span the show's recordings so the detail header reads "2017 — 2024".
# description is sourced from the first non-empty
# show_description across the show's recordings (mirrors the REST
# loadShowDescription helper).
extend type Show {
  localBannerURL: String!
  recordingCount: Int!
  stateCounts: ShowStateCounts!
  firstYear: Int
  lastYear: Int
  description: String!
}

# Performer field extensions. localHeadshotURL is the only enrichment
# the people pages need — performer.recordings is already exposed via
# the entgql-generated edge.
extend type Performer {
  localHeadshotURL: String!
}

# RecordingsListItem mirrors the REST RecordingListItem shape — the
# fields the SPA's recordings list needs to render rows (show name,
# date, tour, master, status, format). Sourced through storage's
# reconciler so the by-status filter agrees with the per-recording
# Status field. Distinct from `Recording` (the ent type) because the
# list page needs a flatter shape than the full node — show name + the
# reconciler-derived status flatten across into a single struct so
# the SPA template doesn't have to chase edges per row.
type RecordingsListItem {
  id: ID!
  showID: ID!
  show: String!
  tour: String!
  dateFull: String!
  dateMonthKnown: Boolean!
  dateDayKnown: Boolean!
  master: String!
  status: String!
  inCollection: Boolean!
  inWants: Boolean!
  fileCount: Int!
  encoraFormat: String!
  localFormat: String!
  localPosterURL: String!
}

# RecordingsListPage is the offset-paginated envelope the SPA list
# pages expect (mirrors the REST { items, total, limit, offset }
# shape). Stays flat rather than wrapping in a Relay connection
# because the page UX is fundamentally page-N-of-M; cursor-based
# pagination doesn't help when the user clicks "Page 7" directly.
type RecordingsListPage {
  items: [RecordingsListItem!]!
  total: Int!
  limit: Int!
  offset: Int!
}

# ShowsListItem mirrors the REST ShowListItem shape — same flatten
# rationale as RecordingsListItem. stateCounts surfaces the per-show
# status histogram the SPA renders as a badge cluster.
type ShowsListItem {
  id: ID!
  name: String!
  recordingCount: Int!
  stateCounts: ShowStateCounts!
  firstYear: Int
  lastYear: Int
  localPosterURL: String!
}

type ShowsListPage {
  items: [ShowsListItem!]!
  total: Int!
  limit: Int!
  offset: Int!
}

extend type Query {
  # recordingsList is the offset-paginated, status-aware list query
  # the SPA's recordings page hits. status is a comma-separated set of
  # storage.Status tokens (synced / format_mismatch / missing /
  # wanted / orphan); empty string disables the filter. sort is one of
  # 'recording' / 'date' / 'master' / 'local_format' / 'status'; dir
  # is 'asc' / 'desc'. Mirrors the legacy /api/v1/recordings shape so
  # the SPA layer is a thin wire-format swap.
  recordingsList(
    status: String
    sort: String
    dir: String
    limit: Int
    offset: Int
  ): RecordingsListPage!

  # showsList is the offset-paginated, sortable by-show aggregate the
  # SPA's /shows page hits. Mirrors /api/v1/shows.
  showsList(
    sort: String
    dir: String
    limit: Int
    offset: Int
  ): ShowsListPage!

  # peopleList is the offset-paginated by-performer aggregate. Scope
  # is collection ∪ wants (only performers credited on a recording
  # the user has or wants surface here). sort is 'name' or 'count';
  # dir is 'asc' or 'desc'. Mirrors /api/v1/people.
  peopleList(
    sort: String
    dir: String
    limit: Int
    offset: Int
  ): PersonListPage!

  # person returns the full performer detail with their recording
  # credits + per-recording reconciler state. Mirrors
  # /api/v1/people/{id}. Returns null when the id doesn't resolve.
  person(id: ID!): PersonDetail
}

# PersonListItem mirrors the REST PersonListItem shape — performer
# header fields plus the per-status histogram so the SPA's badge
# cluster keeps its existing look.
type PersonListItem {
  performerID: ID!
  name: String!
  slug: String!
  recordingCount: Int!
  stateCounts: ShowStateCounts!
}

type PersonListPage {
  items: [PersonListItem!]!
  total: Int!
  limit: Int!
  offset: Int!
}

# PersonRecording is one credit row on the people-detail page.
# Mirrors the REST PersonRecording struct exactly so the SPA renderer
# stays untouched.
type PersonRecording {
  id: ID!
  show: String!
  tour: String!
  dateFull: String!
  dateMonthKnown: Boolean!
  dateDayKnown: Boolean!
  showID: ID!
  state: String!
}

# PersonDetail is the JSON payload for /api/v1/people/{id}. URL is
# the canonical encora.it link the detail page renders as a sidebar
# affordance. localHeadshotURL is the image-cache URL — the SPA also
# falls back to a placeholder if not present.
type PersonDetail {
  performerID: ID!
  name: String!
  slug: String!
  url: String!
  recordings: [PersonRecording!]!
  localHeadshotURL: String!
}

# QueueEntry is one row of the manual import queue. Mirrors
# storage.QueueEntry; the wire id is the prefixed "queue-N" form so
# the Mithril SPA can route on it without juggling raw int64s.
# suggestedRecordingID is nullable when the scanner had no candidate.
# suggestedRecording surfaces the same recording in its rich shape
# (show name, date, tour, master) so the queue table can render the
# match summary without a follow-up round-trip; null when
# suggestedRecordingID is null or the row no longer exists.
type QueueEntry {
  id: ID!
  filePath: String!
  fileSizeBytes: Int!
  discoveredAt: Time!
  lastSeenAt: Time!
  suggestedRecordingID: ID
  suggestedRecording: RecordingsListItem
  suggestedConfidence: String!
  notes: String!
}

extend type Query {
  # queue returns every row in the manual_import_queue ordered
  # oldest-first. Empty queue still returns [] so the client can
  # range over it safely.
  queue: [QueueEntry!]!

  # searchRecordings is the typeahead source for the queue import
  # modal. Matches on show name and tour, ranked by simple
  # substring + position score against the query string.
  # Empty/short queries return []. Limited to ~25 results — the
  # dropdown is meant to narrow down, not paginate.
  searchRecordings(query: String!, limit: Int): [RecordingsListItem!]!

  # previewQueueImport returns the planned destination path for
  # importing the given queue entry as the given recording. Drives
  # the filename preview in the queue import modal. Does NOT move
  # the file; this is purely a Plan-side dry-run.
  previewQueueImport(input: PreviewQueueImportInput!): ImportPreview!
}

# PreviewQueueImportInput drives the previewQueueImport query — the
# queue row's source path + the chosen target recording. Both ids
# are prefixed strings (queue-N, recording-N) so the wire format
# stays consistent with importQueueEntry.
input PreviewQueueImportInput {
  queueID: ID!
  recordingID: ID!
}

# ImportPreview is the planned-destination payload the queue import
# modal renders as a code block. destAbsolute is the full path
# (LibraryRoot + folder + file + ext); destFolder + destFile are the
# split-apart pieces in case the UI wants to render them separately.
type ImportPreview {
  destFolder: String!
  destFile: String!
  destAbsolute: String!
}

# ImportQueueEntryInput drives the importQueueEntry mutation.
# recordingID is optional — when null, the queue entry's
# suggestedRecordingID (which must be set) is used as the target.
input ImportQueueEntryInput {
  queueID: ID!
  recordingID: ID
}

# ImportQueueEntryPayload mirrors the legacy REST importQueueResponse.
# ok=true means the file moved + the queue row was deleted +
# a manual_import history event was written. dest is the moved-to
# path (or planned path on a dry run). error is set when ok=false.
type ImportQueueEntryPayload {
  ok: Boolean!
  action: String!
  dest: String!
  error: String!
}

# Mutation is the root for write surfaces. importQueueEntry is the
# first one — moves a queued file into the canonical library tree and
# clears the queue row on success.
type Mutation {
  importQueueEntry(input: ImportQueueEntryInput!): ImportQueueEntryPayload!
}
