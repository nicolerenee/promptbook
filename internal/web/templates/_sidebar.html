{{define "_sidebar.html"}}
<aside class="pb-side">
  <div class="pb-brand">
    <span class="pb-brand-mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3.5 9.5 C 3.5 5.5, 7 3, 12 3 S 20.5 5.5, 20.5 9.5 V 20 H 3.5 Z"
              fill="currentColor" opacity="0.13" />
        <path d="M3.5 9.5 C 3.5 5.5, 7 3, 12 3 S 20.5 5.5, 20.5 9.5 V 20 H 3.5 Z"
              fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
        <path d="M9 6.5 V 20 M15 6.5 V 20" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        <circle cx="12" cy="20" r="0.9" fill="currentColor" />
      </svg>
    </span>
    <span class="pb-brand-word">promptbook</span>
  </div>

  <div class="pb-nav-group">
    <div class="pb-nav-label">Library</div>
    <a class="pb-nav-item" href="/" {{if eq .ActiveNav "library"}}aria-current="true"{{end}}>
      <span class="pb-nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <path d="M4 5h6v14H4z" /><path d="M14 5h6v14h-6z" /><path d="M7 8v8M17 8v8" />
        </svg>
      </span>
      <span>Library</span>
    </a>
    <a class="pb-nav-item" href="/wants" {{if eq .ActiveNav "wants"}}aria-current="true"{{end}}>
      <span class="pb-nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <path d="M12 21s-7-4.5-7-10.5A4.5 4.5 0 0 1 12 6a4.5 4.5 0 0 1 7 4.5C19 16.5 12 21 12 21z" />
        </svg>
      </span>
      <span>Wants</span>
    </a>
    <a class="pb-nav-item" href="/people" {{if eq .ActiveNav "people"}}aria-current="true"{{end}}>
      <span class="pb-nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <circle cx="9" cy="9" r="3.2" />
          <path d="M3.5 19c.7-3 3-5 5.5-5s4.8 2 5.5 5" />
          <circle cx="17" cy="8" r="2.6" />
          <path d="M14.5 16.5c.5-2 2-3.5 4-3.5s3 1 3 2.5" />
        </svg>
      </span>
      <span>People</span>
    </a>
  </div>

  <div class="pb-nav-group">
    <div class="pb-nav-label">Activity</div>
    <a class="pb-nav-item" href="/queue" {{if eq .ActiveNav "queue"}}aria-current="true"{{end}}>
      <span class="pb-nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <path d="M5 12l4 4 10-10" /><path d="M5 19h14" />
        </svg>
      </span>
      <span>Queue</span>
      <span class="pb-nav-count" data-count="queue"></span>
    </a>
    <a class="pb-nav-item" href="/history" {{if eq .ActiveNav "history"}}aria-current="true"{{end}}>
      <span class="pb-nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <circle cx="12" cy="12" r="8" /><path d="M12 7v5l3.5 2.5" />
        </svg>
      </span>
      <span>History</span>
    </a>
    <a class="pb-nav-item" href="/sync" {{if eq .ActiveNav "sync"}}aria-current="true"{{end}}>
      <span class="pb-nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <path d="M4 12a8 8 0 0 1 14-5.3" />
          <path d="M20 12a8 8 0 0 1-14 5.3" />
          <path d="M18 3v4h-4M6 21v-4h4" />
        </svg>
      </span>
      <span>Sync</span>
    </a>
  </div>

  <div class="pb-nav-group">
    <div class="pb-nav-label">Reconcile</div>
    <a class="pb-nav-item" href="/mismatches" {{if eq .ActiveNav "mismatches"}}aria-current="true"{{end}}>
      <span class="pb-nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <path d="M5 7h10M5 7l3-3M5 7l3 3" />
          <path d="M19 17H9M19 17l-3-3M19 17l-3 3" />
        </svg>
      </span>
      <span>Mismatches</span>
      <span class="pb-nav-count" data-count="mismatches"></span>
    </a>
  </div>

  <div class="pb-side-foot">
    <div data-foot="endpoint">encora.it</div>
    <div class="pb-rate">
      <span>rate</span>
      <span class="pb-rate-bar"><span data-foot="rate-fill" style="width: 0%"></span></span>
      <span data-foot="rate-text">—/30</span>
    </div>
    <div data-foot="version">{{.Version}}</div>
  </div>
</aside>
{{end}}
